name: Windows package
on:
  workflow_dispatch:
  push:
    branches: [deployment/windows-packaging, main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m playwright install chromium
      - run: python scripts/verify_distribution.py
      - run: python -m pytest -q
      - run: python -m PyInstaller --clean --noconfirm AcademyPayroll.spec
      - run: python scripts/verify_distribution.py dist/AcademyPayroll.exe
      - run: python scripts/smoke_executable.py dist/AcademyPayroll.exe
      - shell: pwsh
        run: |
          Get-FileHash dist/AcademyPayroll.exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
          python -m pip freeze | Out-File dist/build-dependencies.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AcademyPayroll-windows-x64-${{ github.run_number }}-${{ github.sha }}
          path: |
            dist/AcademyPayroll.exe
            dist/SHA256.txt
            dist/build-dependencies.txt
          retention-days: 30
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AcademyPayroll-windows-x64-*
          path: release
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --draft --verify-tag --title "$TAG" --notes 'Windows x64 package. Review smoke test results before publication.'
